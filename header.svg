</svg></g>

 <g class="a1"><text x="84" y="104" class="m" font-size="15" letter-spacing="3.2" fill="#9a8fb6">SEYFU.DEV · BUILDING IN PUBLIC</text></g>
 <g class="a2"><text x="80" y="218" class="t" font-size="96" fill="#f1ecfb">Hey, I'm <tspan fill="url(#name)">Dani</tspan></text></g>
