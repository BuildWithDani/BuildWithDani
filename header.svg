  </g>
</svg></g>

 <g class="a1"><text x="72" y="70" class="m" font-size="13" letter-spacing="3.2" fill="#9a8fb6">SEYFU.DEV · BUILDING IN PUBLIC</text></g>
 <g class="a2"><text x="68" y="146" class="t" font-size="74" fill="#f1ecfb">Hey, I'm <tspan fill="url(#name)">Dani</tspan></text></g>
 <g class="a3"><text x="72" y="196" class="m" font-size="17" fill="#9a8fb6"><tspan fill="#AB72F3">&gt;</tspan> founder @ buildwithdani — Independent Studio<tspan class="caret" fill="#AB72F3">_</tspan></text></g>
