<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Hey, I'm Dani — founder at BuildWithDani">
<title>Hey, I'm Dani — founder @ BuildWithDani</title>
<defs>
<style>@font-face{font-family:'Tight';font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
.t{font-family:'Tight',-apple-system,'Segoe UI',sans-serif;font-weight:800;letter-spacing:-3px}
.m{font-family:'Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:500}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes bob{0%,100%{transform:translate(0,0) rotate(-2deg)}50%{transform:translate(0,-7px) rotate(2deg)}}
@keyframes dot{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes type{from{width:0}to{width:560px}}
.a1{animation:up .9s cubic-bezier(.2,.7,.2,1) .05s both}
.a2{animation:up .9s cubic-bezier(.2,.7,.2,1) .25s both}
.a3{animation:up .9s cubic-bezier(.2,.7,.2,1) .45s both}
.a4{animation:up .9s cubic-bezier(.2,.7,.2,1) .65s both}
.spin{transform-origin:1050px 125px;animation:spin 90s linear infinite}
.spinr{transform-origin:1050px 125px;animation:spinr 140s linear infinite}
.glow{animation:pulse 5s ease-in-out infinite}
.caret{animation:blink 1.1s steps(1) infinite}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 4.5s ease-in-out infinite}
.dot{animation:dot 1.6s ease-in-out infinite}
</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#170d2b"/><stop offset="1" stop-color="#0c0816"/></linearGradient>
<radialGradient id="halo" cx="1050" cy="125" r="170" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#AB72F3" stop-opacity=".42"/><stop offset=".45" stop-color="#360B78" stop-opacity=".35"/><stop offset="1" stop-color="#360B78" stop-opacity="0"/></radialGradient>
<linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d4b8ff"/><stop offset="1" stop-color="#AB72F3"/></linearGradient>
<linearGradient id="burst" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#AB72F3"/><stop offset="1" stop-color="#6a2fd0"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#AB72F3" opacity=".10"/></pattern>
<clipPath id="card"><rect width="1200" height="250" rx="28"/></clipPath>
<mask id="fadeL" maskUnits="userSpaceOnUse"><rect width="1200" height="250" fill="url(#fl)"/></mask>
<linearGradient id="fl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000"/><stop offset=".45" stop-color="#000"/><stop offset=".62" stop-color="#fff"/></linearGradient>
</defs>
