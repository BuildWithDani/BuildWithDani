<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Crew manifest. Ship before it's perfect. Build in public. Make it feel good. Cleared for departure.">
<title>Crew manifest · ship's rules</title>
<defs><style>@font-face{font-family:'S6';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'M';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'MB';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
.s{font-family:'S6',-apple-system,'Segoe UI',sans-serif;font-weight:700;letter-spacing:-.6px}
.m{font-family:'M',ui-monospace,Menlo,monospace;font-weight:500}
.mb{font-family:'MB',ui-monospace,Menlo,monospace;font-weight:700}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes stamp{0%,8%{opacity:0;transform:scale(2.4) rotate(-4deg)}14%{opacity:1;transform:scale(.94) rotate(-12deg)}18%,88%{opacity:1;transform:scale(1) rotate(-12deg)}96%,100%{opacity:0;transform:scale(1) rotate(-12deg)}}
@keyframes ink{0%,13%{opacity:0}15%{opacity:.5}40%,88%{opacity:.18}96%,100%{opacity:0}}
.r{animation:up .8s cubic-bezier(.2,.7,.2,1) both} .r0{animation-delay:.1s}.r1{animation-delay:.25s}.r2{animation-delay:.4s}
.st{transform-origin:1060px 128px;animation:stamp 7s cubic-bezier(.3,1.4,.5,1) infinite}
.ink{transform-origin:1060px 128px;animation:ink 7s ease-out infinite}
</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0f31"/><stop offset="1" stop-color="#0c0816"/></linearGradient>
<pattern id="guil" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 9 Q4.5 3 9 9 T18 9" fill="none" stroke="#AB72F3" stroke-opacity=".07"/></pattern>
<filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
<mask id="cut" maskUnits="userSpaceOnUse"><rect width="1200" height="250" rx="26" fill="#fff"/><circle cx="0" cy="125.0" r="14" fill="#000"/><circle cx="1200" cy="125.0" r="14" fill="#000"/></mask>
</defs>
<g mask="url(#cut)">
 <rect width="1200" height="250" fill="url(#bg)"/><rect width="1200" height="250" fill="url(#guil)"/>
 <rect x=".75" y=".75" width="1198.5" height="248.5" rx="25.25" fill="none" stroke="#AB72F3" stroke-opacity=".28" stroke-width="1.5"/>
</g>
<text x="64" y="58" class="m" font-size="13" letter-spacing="3" fill="#AB72F3">CREW MANIFEST · SHIP'S RULES</text>
<line x1="64" y1="76" x2="1136" y2="76" stroke="#AB72F3" stroke-opacity=".18"/>
<g class="r r0">
 <text x="64" y="112" class="m" font-size="13" letter-spacing="2" fill="#AB72F3">01</text>
 <line x1="94" y1="108" x2="314" y2="108" stroke="#AB72F3" stroke-opacity=".25"/>
 <text x="64" y="150" class="s" font-size="24" fill="#f3eefc">Ship before it's perfect.</text>
 <text x="64" y="182" class="m" font-size="14.5" fill="#9a8fb6">Momentum beats polish.</text>
</g><g class="r r1">
 <text x="364" y="112" class="m" font-size="13" letter-spacing="2" fill="#AB72F3">02</text>
 <line x1="394" y1="108" x2="614" y2="108" stroke="#AB72F3" stroke-opacity=".25"/>
 <text x="364" y="150" class="s" font-size="24" fill="#f3eefc">Build in public.</text>
 <text x="364" y="182" class="m" font-size="14.5" fill="#9a8fb6">Wins and wrecks, logged.</text>
</g><g class="r r2">
 <text x="664" y="112" class="m" font-size="13" letter-spacing="2" fill="#AB72F3">03</text>
 <line x1="694" y1="108" x2="914" y2="108" stroke="#AB72F3" stroke-opacity=".25"/>
 <text x="664" y="150" class="s" font-size="24" fill="#f3eefc">Make it feel good.</text>
 <text x="664" y="182" class="m" font-size="14.5" fill="#9a8fb6">Or it isn't done yet.</text>
</g>
<line x1="64" y1="206" x2="930" y2="206" stroke="#AB72F3" stroke-opacity=".18"/>
<circle cx="1060" cy="128" r="78" fill="#AB72F3" class="ink" filter="url(#rough)"/>
<g class="st" filter="url(#rough)">
 <circle cx="1060" cy="128" r="74" fill="none" stroke="#AB72F3" stroke-width="3.5"/>
 <circle cx="1060" cy="128" r="64" fill="none" stroke="#AB72F3" stroke-width="1.5"/>
 <text x="1060" y="110" text-anchor="middle" class="mb" font-size="12" fill="#AB72F3">★ ★ ★</text>
 <text x="1060" y="136" text-anchor="middle" class="mb" font-size="22" letter-spacing="1" fill="#d9c2ff">CLEARED</text>
 <text x="1060" y="156" text-anchor="middle" class="mb" font-size="10.5" letter-spacing="1.4" fill="#AB72F3">FOR DEPARTURE</text>
</g>
</svg>